name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run backend tests
        run: npm run test:backend

      # Kept as its own step (rather than folded into `npm test`) so a failure
      # here is attributable at a glance in the checks UI. The userscript suite
      # is plain node:test with no dependencies of its own - `tampermonkey` is
      # deliberately not an npm workspace, since `npm run build --workspaces`
      # would then fail on it for having no build script.
      - name: Run userscript tests
        run: npm run test:tampermonkey
