# Builds and pushes the control-plane image via Cloud Build (no local Docker
# daemon required). Run from the repo root:
#
#   gcloud builds submit --config=infra/docker/control-plane.cloudbuild.yaml \
#     --substitutions=_IMAGE=us-central1-docker.pkg.dev/PROJECT_ID/res-bot/control-plane:latest .
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'infra/docker/control-plane.Dockerfile', '-t', '${_IMAGE}', '.']
images:
  - '${_IMAGE}'
